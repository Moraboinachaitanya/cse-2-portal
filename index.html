<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-DS Portal Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg">

<div class="card">
    <h2>AI-DS Portal</h2>
    <p>Choose your portal.</p>

    <a href="student.html" class="primary-btn">Student Portal (Open Access)</a>
    <br><br>
    <a href="login.html" class="primary-btn" id="teacherPortalLink">Teacher Portal (Login Required)</a>
</div>

<script>
    const TEACHER_ACCESS_CODE = "8279";

    document.getElementById("teacherPortalLink").addEventListener("click", function (event) {
        const enteredCode = prompt("Enter Teacher Access Code:");

        if (enteredCode === null) {
            event.preventDefault();
            return;
        }

        if (enteredCode.trim() !== TEACHER_ACCESS_CODE) {
            event.preventDefault();
            alert("Wrong access code. Teacher portal is restricted.");
            return;
        }

        localStorage.setItem("teacherId", TEACHER_ACCESS_CODE);
        localStorage.setItem("loginRole", "teacher");
    });
</script>

</body>
</html>
